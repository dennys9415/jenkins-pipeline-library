# Project identification
sonar.projectKey=jenkins-pipeline-library
sonar.projectName=Jenkins Pipeline Library
sonar.projectVersion=1.0.0

# Project metadata
sonar.projectDescription=Shared Jenkins Pipeline Library with reusable components, security scanning, and deployment orchestration

# Source code configuration
sonar.sources=src,vars
sonar.tests=test
sonar.groovy.binaries=build/classes
sonar.groovy.libraries=~/.groovy/**/*.jar

# Language specific settings
sonar.sourceEncoding=UTF-8
sonar.groovy.file.suffixes=.groovy

# Test coverage and reporting
sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml
sonar.junit.reportPaths=build/test-results/test
sonar.groovy.coveragePlugin=jacoco

# Quality Gate settings
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Exclude files and directories
sonar.exclusions=**/examples/**,**/resources/**,**/docs/**,**/scripts/**,**/.github/**,**/*.jenkinsfile
sonar.test.exclusions=**/test/resources/**

# Test inclusion
sonar.test.inclusions=**/test/**,**/*Test.groovy,**/*Spec.groovy

# Duplication exclusions
sonar.cpd.exclusions=**/examples/**,**/resources/**,**/docs/**

# Groovy specific analysis settings
sonar.groovy.files=src/**/*.groovy,vars/**/*.groovy

# External analyzers integration
sonar.pmd.ruleSet=resources/config/pmd-ruleset.xml
sonar.checkstyle.config=resources/config/checkstyle-config.xml

# Analysis settings
sonar.verbose=false
sonar.scm.provider=git
sonar.scm.disabled=false

# Branch analysis
sonar.branch.name=main

# Quality Profile
sonar.groovy.profile=Groovy Way

# Custom metrics thresholds
sonar.groovy.coverage.minimum=70
sonar.groovy.duplicatedLines.minimum=5
sonar.groovy.complexity.max=15

# Ignore specific issues in pipeline patterns
sonar.issue.ignore.multicriteria=p1,p2,p3
sonar.issue.ignore.multicriteria.p1.ruleKey=groovy:S001
sonar.issue.ignore.multicriteria.p1.resourceKey=**/vars/*.groovy
sonar.issue.ignore.multicriteria.p2.ruleKey=groovy:MethodReturnTypeRequired
sonar.issue.ignore.multicriteria.p2.resourceKey=**/vars/*.groovy
sonar.issue.ignore.multicriteria.p3.ruleKey=groovy:VariableTypeRequired
sonar.issue.ignore.multicriteria.p3.resourceKey=**/vars/*.groovy